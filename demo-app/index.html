<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sign in</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 30rem; margin: 4rem auto; }
    label { display: block; margin: .75rem 0 .25rem; }
    input, button { font-size: 1rem; padding: .4rem .6rem; }
    #error { color: #b00020; }
  </style>
</head>
<body>
  <h1>Acme Co.</h1>
  <form id="signin">
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password">
    <p id="error" hidden>Credentials required</p>
    <p><button type="submit" id="signin-btn">Sign In</button></p>
  </form>
  <script>
    const form = document.getElementById('signin');
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const user = document.getElementById('username').value.trim();
      if (!user) { document.getElementById('error').hidden = false; return; }
      sessionStorage.setItem('user', user);
      location.href = 'app.html';
    });
  </script>
</body>
</html>
